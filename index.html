<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASL Context Learning</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="header-left">
      <span class="logo">ASL Context Learning</span>
      <span class="tagline">Built by a deaf learner, for deaf learners.</span>
    </div>
  </header>

  <main>

    <!-- ── LEFT: scene banner + narration ───────────────────── -->
    <section class="content-panel">
      <div class="scene-banner" id="scene-container">
        <!-- Scene SVG injected by app.js -->
      </div>
      <div class="story-panel" id="story-container">
        <!-- Stories rendered by app.js -->
      </div>
    </section>

    <!-- ── RIGHT: shared info / video panel ──────────────────── -->
    <aside class="info-panel" id="info-panel">
      <div class="info-idle" id="info-idle">
        <p id="idle-hint">Click any object in the scene above, or any highlighted word in the story, to learn its ASL sign.</p>
      </div>

      <div class="info-active hidden" id="info-active">
        <h2 id="word-title"></h2>

        <div class="video-wrap">
          <video id="asl-video" loop autoplay muted playsinline>
            <source src="" type="video/mp4" />
          </video>
          <p class="video-note" id="video-note"></p>
        </div>

        <div class="context-wrap">
          <h3>Often described as</h3>
          <p id="word-context">—</p>
        </div>

        <div class="context-wrap">
          <h3>In context</h3>
          <p id="word-incontext">—</p>
        </div>

        <button class="reset-btn" id="reset-btn">← Back</button>
      </div>
    </aside>

  </main>

  <footer>
    <span>ASL signs from <a href="https://www.kaggle.com/datasets/risangbaskoro/wlasl-processed" target="_blank">WLASL dataset</a> · Context words from <a href="https://www.datamuse.com/api/" target="_blank">Datamuse API</a></span>
  </footer>

  <script src="wlasl-urls.js"></script>
  <script src="app.js"></script>
</body>
</html>
